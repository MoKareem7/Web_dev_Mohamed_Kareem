<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Todo List App</h1>
        
        <div class="input-section">
            <input type="text" id="todo-input" placeholder="What needs doing?">
            <button id="add-btn">Add</button>
        </div>
        
        <p class="tip">Tip: double-click a todo to edit. Press Enter to save.</p>

        <div class="filters">
            <button id="filter-all">All</button>
            <button id="filter-active">Active</button>
            <button id="filter-completed">Completed</button>
        </div>

        <ul id="todo-list">
        </ul>

        <div class="footer">
            <span id="item-count">0 items left</span>
            <div class="footer-btns">
                <button id="clear-completed">Clear completed</button>
                <button id="clear-all">Clear all</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
